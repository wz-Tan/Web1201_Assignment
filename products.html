<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Products</title>
        <link rel="stylesheet" href="./css/styles.css" />
        <link rel="stylesheet" href="./css/fonts.css" />
        <link rel="stylesheet" href="./css/utils.css" />
    </head>
    <body>
        <header>
            <h1 class="text-large text-bold text-accent">SigmaStore</h1>
            <nav>
                <ul class="text-medium">
                    <li><a href="products.html">Products</a></li>
                    <li><a href="review.html">Review</a></li>
                    <li><a href="about-us.html">About Us</a></li>
                </ul>
            </nav>
            <h1 class="text-medium">Sign Out</h1>
        </header>
        <main class="container">
            <h1 id="title" class="text-bold text-extra-large">All Products</h1>
            <!--Grid that splits left for sorting and right for products-->
            <div class="product-grid">
                <section class="items-grid"></section>
                <section class="items-query">
                    <h2 class="text-large text-bold">Categories</h2>
                    <div class="category-radio text-medium">
                        <input
                            type="radio"
                            name="category"
                            value="All"
                            checked
                        />
                        <label>All</label><br />

                        <input type="radio" name="category" value="Men's" />
                        <label>Men's</label><br />

                        <input type="radio" name="category" value="Women's" />
                        <label>Women's</label><br />

                        <input type="radio" name="category" value="Unisex" />
                        <label>Unisex</label><br />
                    </div>
                </section>
            </div>
        </main>
        <footer>
            <div class="left">
                <!-- Main Text -->
                <div>
                    <h1 class="text-large text-bold">SigmaStore</h1>
                    <h2 class="text-medium">
                        Bringing you the best products since 2020.
                    </h2>
                </div>

                <!-- Copyright -->
                <p class="text-small text-light">
                    <em>&copy; SigmaStore, 2026</em>
                </p>
            </div>
            <div class="right">
                <nav>
                    <ul class="text-large">
                        <li><a href="products.html">Products</a></li>
                        <li><a href="review.html">Review</a></li>
                        <li><a href="about-us.html">About Us</a></li>
                    </ul>
                </nav>
            </div>
        </footer>
        <script src="./js/products.js" />
    </body>
</html>
