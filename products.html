<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Products</title>
        <link rel="stylesheet" href="./css/styles.css" />
        <link rel="stylesheet" href="./css/fonts.css" />
        <link rel="stylesheet" href="./css/utils.css" />
        <link rel="stylesheet" href="./css/products.css" />

        <!--Avoid Flash of Incorrect Theme-->
        <script>
            // Load saved theme on page load (carry between pages)
            const savedTheme = localStorage.getItem("theme");
            if (savedTheme === "dark") {
                document.documentElement.classList.add("dark");
            }
        </script>
    </head>
    <body>
        <header>
            <a href="./home.html" class="text-large text-bold text-accent"
                >SigmaStore</a
            >
            <nav>
                <ul class="text-medium">
                    <li>
                        <a class="underline-effect" href="products.html"
                            >Products</a
                        >
                    </li>
                    <li>
                        <a class="underline-effect" href="review.html"
                            >Review</a
                        >
                    </li>
                    <li>
                        <a class="underline-effect" href="about-us.html"
                            >About Us</a
                        >
                    </li>
                </ul>
            </nav>
            <div class="right">
                <button class="text-medium btn-theme">🌙</button>
                <a href="../index.html" class="text-medium sign-out"
                    >Sign Out</a
                >
            </div>
        </header>
        <main class="container products">
            <h1 id="title" class="text-bold text-extra-large">All Products</h1>
            <!--Grid that splits left for sorting and right for products-->
            <div class="product-grid">
                <section class="items-filter">
                    <!--Search for An Item-->
                    <input
                        type="text"
                        class="text-small"
                        id="item-query"
                        placeholder="Search For An Item..."
                    />

                    <!--Sort By Pricing-->
                    <div class="radio-div">
                        <div class="category-filter">
                            <!--Sort By Categories-->
                            <h2 class="text-large text-bold">Categories</h2>
                            <div class="category-radio text-medium">
                                <input
                                    type="radio"
                                    name="category"
                                    value="All"
                                    checked
                                />
                                <label>All</label><br />

                                <input
                                    type="radio"
                                    name="category"
                                    value="Men's"
                                />
                                <label>Men's</label><br />

                                <input
                                    type="radio"
                                    name="category"
                                    value="Women's"
                                />
                                <label>Women's</label><br />

                                <input
                                    type="radio"
                                    name="category"
                                    value="Unisex"
                                />
                                <label>Unisex</label><br />
                            </div>
                        </div>
                        <div class="price-filter">
                            <h2 class="text-large text-bold">Sort By</h2>
                            <div class="pricing-radio text-medium">
                                <input
                                    type="radio"
                                    name="pricing"
                                    value="ascending"
                                    checked
                                />
                                <label>Price Ascending</label><br />

                                <input
                                    type="radio"
                                    name="pricing"
                                    value="descending"
                                />
                                <label>Price Descending</label><br />
                            </div>
                        </div>
                    </div>
                </section>
                <section class="items-grid"></section>
            </div>
        </main>
        <footer>
            <nav>
                <ul class="text-large">
                    <li>
                        <a class="underline-effect" href="products.html"
                            >Products</a
                        >
                    </li>
                    <li>
                        <a class="underline-effect" href="review.html"
                            >Review</a
                        >
                    </li>
                    <li>
                        <a class="underline-effect" href="about-us.html"
                            >About Us</a
                        >
                    </li>
                </ul>
            </nav>
            <div class="company-tag">
                <!-- Main Text -->
                <div>
                    <a href="../home.html" class="text-large text-bold"
                        >SigmaStore</a
                    >
                    <h2 class="text-medium">
                        Bringing you the best products since 2020.
                    </h2>
                </div>

                <!-- Copyright -->
                <p class="text-small text-light">
                    <em>&copy; SigmaStore, 2026</em>
                </p>
            </div>
        </footer>
        <script src="./js/products.js"></script>
        <script src="./js/theme.js"></script>
    </body>
</html>
