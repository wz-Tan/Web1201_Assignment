<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Products</title>
        <link rel="stylesheet" href="./css/styles.css" />
        <link rel="stylesheet" href="./css/fonts.css" />
        <link rel="stylesheet" href="./css/utils.css" />
        <script>
            // Load saved theme on page load (carry between pages)
            const savedTheme = localStorage.getItem("theme");
            if (savedTheme === "dark") {
                document.documentElement.classList.add("dark");
            }
        </script>
    </head>
    <body>
        <header>
            <!--Mobile Version-->
            <div class="mobile">
                <div class="main-compartment">
                    <a
                        href="./home.html"
                        class="store-name text-large text-bold text-accent"
                        >SigmaStore</a
                    >
                    <button
                        class="text-medium btn-theme"
                        aria-label="Toggle dark mode"
                    >
                        🌙
                    </button>
                    <!--Trigger Button on Mobile-->
                    <button
                        class="btn-header text-large text-bold"
                        aria-label="Open navigation menu"
                    >
                        ☰
                    </button>
                </div>

                <nav class="header-dropdown">
                    <ul class="text-large">
                        <li>
                            <a
                                class="text-bold underline-effect"
                                href="products.html"
                                >Products</a
                            >
                        </li>
                        <li>
                            <a
                                class="text-bold underline-effect"
                                href="review.html"
                                >Review</a
                            >
                        </li>
                        <li>
                            <a
                                class="text-bold underline-effect"
                                href="about-us.html"
                                >About Us</a
                            >
                        </li>
                        <li>
                            <a
                                class="text-bold underline-effect"
                                href="index.html"
                                >Sign Out</a
                            >
                        </li>
                    </ul>
                </nav>
            </div>

            <!--Tablet + Laptop-->
            <div class="non-mobile">
                <a href="./home.html" class="text-large text-bold text-accent"
                    >SigmaStore</a
                >
                <nav>
                    <ul class="text-medium">
                        <li>
                            <a class="underline-effect" href="products.html"
                                >Products</a
                            >
                        </li>
                        <li>
                            <a class="underline-effect" href="review.html"
                                >Review</a
                            >
                        </li>
                        <li>
                            <a class="underline-effect" href="about-us.html"
                                >About Us</a
                            >
                        </li>
                    </ul>
                </nav>
                <div class="right">
                    <button
                        class="text-medium btn-theme"
                        aria-label="Toggle dark mode"
                    >
                        🌙
                    </button>
                    <a href="../index.html" class="text-medium sign-out"
                        >Sign Out</a
                    >
                </div>
            </div>
        </header>
        <main class="container">
            <h1 class="text-medium">Your Content Here</h1>
        </main>
        <footer>
            <nav>
                <ul class="text-large">
                    <li>
                        <a class="underline-effect" href="products.html"
                            >Products</a
                        >
                    </li>
                    <li>
                        <a class="underline-effect" href="review.html"
                            >Review</a
                        >
                    </li>
                    <li>
                        <a class="underline-effect" href="about-us.html"
                            >About Us</a
                        >
                    </li>
                </ul>
            </nav>
            <div class="company-tag">
                <!-- Main Text -->
                <div>
                    <a href="../home.html" class="text-large text-bold"
                        >SigmaStore</a
                    >
                    <h2 class="text-medium">
                        Bringing you the best products since 2020.
                    </h2>
                </div>

                <!-- Copyright -->
                <p class="text-small text-light">
                    <em>&copy; SigmaStore, 2026</em>
                </p>
            </div>
        </footer>
        <script src="./js/theme.js"></script>
    </body>
</html>
