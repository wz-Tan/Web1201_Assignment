<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="./css/fonts.css" />
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="stylesheet" href="./css/login.css" />
</head>

<body>
  <div class="fullscreen-container registration-flexbox">
    <div class="registration-card">
      <div class="welcome-side">
        <h2 class="text-large text-bold">Welcome Back to Sigma Store!</h2>
        <p class="text-small">Your next favorite find is here!</p>

      </div>
      <div class="login-side">
        <div class="home">
          <button class="btn-primary">&#8962;</button>
          <span>Home Page</span>
        </div>
        <h2 class="text-large text-bold create-text">Login to your account</h2>
        <div class="userinfo">
          <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username">
          </div>
          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password">
          </div>
        </div>
        <button class="btn-primary sign-up-button">Log in</button>
      </div>
    </div>
  </div>
</body>

</html>
