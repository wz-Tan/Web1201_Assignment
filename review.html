<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Products</title>
        <link rel="stylesheet" href="./css/styles.css" />
        <link rel="stylesheet" href="./css/fonts.css" />
        <link rel="stylesheet" href="./css/utils.css" />
    </head>
    <body>
        <header>
            <h1 class="text-large text-bold text-accent">SigmaStore</h1>
            <nav>
                <ul class="text-medium">
                    <li><a href="products.html">Products</a></li>
                    <li><a href="review.html">Review</a></li>
                    <li><a href="about-us.html">About Us</a></li>
                </ul>
            </nav>
            <h1 class="text-medium">Sign Out</h1>
        </header>


        <main class="container review-grid">
            <!--left side -->
            <section>
                <h2 class="text-medium text-bold text-accent">Submit a Review</h2>
                <form class="review-form">

                    <!--dropdown-->
                    <div class="input-group dropdown-container">
                        <label class="text-small text-semibold">Search Product</label>
                        <input type="text" id="product-input" placeholder="Type to search" class="input-box" autocomplete="off" required>
                        <div id="dropdown" class="dropdown-menu"></div>
                    </div>

                    <!--ratings-->
                    <div class="input-group">
                        <label class="text-small text-semibold">Your Rating</label>
                        <div class="ratings-wrapper">
                            <div class="ratings">
                            <span data-rating="5">&#9733;</span>
                            <span data-rating="4">&#9733;</span>
                            <span data-rating="3">&#9733;</span>
                            <span data-rating="2">&#9733;</span>
                            <span data-rating="1">&#9733;</span>
                        </div>
                        </div>
                    </div>
                </form>
            </section>
        </main>
        
        <footer>
            <div class="left">
                <!-- Main Text -->
                <div>
                    <h1 class="text-large text-bold">SigmaStore</h1>
                    <h2 class="text-medium">
                        Bringing you the best products since 2020.
                    </h2>
                </div>

                <!-- Copyright -->
                <p class="text-small text-light">
                    <em>&copy; SigmaStore, 2026</em>
                </p>
            </div>
            <div class="right">
                <nav>
                    <ul class="text-large">
                        <li><a href="products.html">Products</a></li>
                        <li><a href="review.html">Review</a></li>
                        <li><a href="about-us.html">About Us</a></li>
                    </ul>
                </nav>
            </div>
        </footer>

        <script src="./js/products.js"></script>
        <script src="./js/review.js"></script>
    </body>
</html>
