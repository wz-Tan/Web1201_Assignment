<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Products</title>
        <link rel="stylesheet" href="./css/styles.css" />
        <link rel="stylesheet" href="./css/fonts.css" />
        <link rel="stylesheet" href="./css/utils.css" />
        <link rel="stylesheet" href="./css/review.css" />
        <!--Avoid Flash of Incorrect Theme-->
        <script>
            // Load saved theme on page load (carry between pages)
            const savedTheme = localStorage.getItem("theme");
            if (savedTheme === "dark") {
                document.documentElement.classList.add("dark");
            }
        </script>
    </head>
    <body>
                <header>
            <!--Mobile Version-->
            <div class="mobile">
                <div class="main-compartment">
                    <a
                        href="./home.html"
                        class="store-name text-large text-bold text-accent"
                        >SigmaStore</a
                    >
                    <button class="text-medium btn-theme" aria-label="Toggle dark mode">🌙</button>
   <!--Trigger Button on Mobile-->
<button class="btn-header text-large text-bold" aria-label="Open navigation menu">☰</button>
                </div>

                <nav class="header-dropdown">
                    <ul class="text-large">
                        <li>
                            <a
                                class="text-bold underline-effect"
                                href="products.html"
                                >Products</a
                            >
                        </li>
                        <li>
                            <a
                                class="text-bold underline-effect"
                                href="review.html"
                                >Review</a
                            >
                        </li>
                        <li>
                            <a
                                class="text-bold underline-effect"
                                href="about-us.html"
                                >About Us</a
                            >
                        </li>
                        <li>
                            <a
                                class="text-bold underline-effect js-sign-out"
                                >Sign Out</a
                            >
                        </li>
                    </ul>
                </nav>
            </div>

            <!--Tablet + Laptop-->
            <div class="non-mobile">
                <a href="./home.html" class="text-large text-bold text-accent"
                    >SigmaStore</a
                >
                <nav>
                    <ul class="text-medium">
                        <li>
                            <a class="underline-effect" href="products.html"
                                >Products</a
                            >
                        </li>
                        <li>
                            <a class="underline-effect" href="review.html"
                                >Review</a
                            >
                        </li>
                        <li>
                            <a class="underline-effect" href="about-us.html"
                                >About Us</a
                            >
                        </li>
                    </ul>
                </nav>
                <div class="right">
                   <button class="text-medium btn-theme" aria-label="Toggle dark mode">🌙</button>
                    <a class="text-medium sign-out js-sign-out"
                        >Sign Out</a
                    >
                </div>
            </div>
        </header>

        <main class="container review-grid">
            <!--left side -->
            <section>
                <h2 class="text-extra-large text-bold text-accent">
                    Submit a Review
                </h2>
                <form class="review-form" id="review-form" autocomplete="off">
                    <!--dropdown-->
                    <div class="input-group">
                        <label class="text-large text-semibold"
                            >Search Product</label
                        >
                        <div class="dropdown-container">
                            <input
                                type="text"
                                id="product-input"
                                placeholder="Type to search"
                                class="input-box text-medium"
                                required
                            />
                            <div id="dropdown" class="dropdown-menu"></div>
                        </div>
                        <img id="product-image" />
                    </div>

                    <!--ratings-->
                    <div class="input-group">
                        <label class="text-medium text-semibold"
                            >Your Rating</label
                        >
                        <div class="ratings-wrapper">
                            <div class="ratings">
                                <span data-rating="5">&#9733;</span>
                                <span data-rating="4">&#9733;</span>
                                <span data-rating="3">&#9733;</span>
                                <span data-rating="2">&#9733;</span>
                                <span data-rating="1">&#9733;</span>
                            </div>
                        </div>
                    </div>

                    <!--Username-->
                    <div class="input-group">
                        <label class="text-medium text-semibold"
                            >Username</label
                        >
                        <input
                            class="input-box text-medium"
                            type="text"
                            id="username"
                            spellcheck="false"
                            placeholder="Enter your username"
                            required
                        />
                    </div>

                    <!--comment-->
                    <div class="input-group">
                        <label class="text-medium text-semibold">Review</label>
                        <textarea
                            class="input-box text-medium"
                            id="review"
                            rows="4"
                            placeholder="Type your review..."
                            maxlength="200"
                        ></textarea>
                        <div id="char-count" class="text-small">0 / 200</div>
                    </div>

                    <!--button-->
                    <button type="submit" class="text-medium text-bold">
                        Submit
                    </button>
                </form>
            </section>

            <!--right side-->
            <section>
                <h2 class="text-extra-large text-bold">Recent Reviews</h2>
                <div id="reviews-list"></div>
            </section>
        </main>

        <footer>
            <nav>
                <ul class="text-large">
                    <li>
                        <a class="underline-effect" href="products.html"
                            >Products</a
                        >
                    </li>
                    <li>
                        <a class="underline-effect" href="review.html"
                            >Review</a
                        >
                    </li>
                    <li>
                        <a class="underline-effect" href="about-us.html"
                            >About Us</a
                        >
                    </li>
                </ul>
            </nav>
            <div class="company-tag">
                <!-- Main Text -->
                <div>
                    <a href="../home.html" class="text-large text-bold"
                        >SigmaStore</a
                    >
                    <h2 class="text-medium">
                        Bringing you the best products since 2020.
                    </h2>
                </div>

                <!-- Copyright -->
                <p class="text-small text-light">
                    <em>&copy; SigmaStore, 2026</em>
                </p>
            </div>
        </footer>
        <script src="./js/theme.js"></script>
        <script src="./js/products.js"></script>
        <script src="./js/review.js"></script>
        <script src="./js/auth.js"></script>
    </body>
</html>
